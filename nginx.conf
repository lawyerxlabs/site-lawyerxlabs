# App and sign-in routes share the SPA shell; keep them out of search indexes, public pages stay indexable.
# Keyed on $request_uri: try_files falls back to /index.html, which would hide the original path from $uri.
map $request_uri $robots_tag {
    default "";
    ~^/(mvp|playground|app|login|access-pending)(/|\?|$) "noindex, nofollow";
}

server {
    listen ${NGINX_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Empty value means nginx omits the header. Locations that set their own add_header (API proxies) skip this.
    add_header X-Robots-Tag $robots_tag always;

    # Docker embedded DNS. Upstreams are set via variables so nginx resolves them per request;
    # a recreated gateway/auth container does not require recreating this web container.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cloudflared runs on host network; its packets reach nginx via the docker bridge gateway (172.20.0.1).
    # Trust only that one address, not the whole frontend subnet, to prevent containers spoofing X-Forwarded-For.
    set_real_ip_from  172.20.0.1/32;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    location ^~ /v1/ {
        client_max_body_size 11m;
        error_page 413 = @upload_too_large;
        set $gateway_upstream ${NGINX_GATEWAY_UPSTREAM};
        proxy_pass $gateway_upstream;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HR staged v1 (sessions/generation/delete): same proxy and body-overhead backstop as /v1.
    location ^~ /hr/v1/ {
        client_max_body_size 11m;
        error_page 413 = @upload_too_large;
        set $gateway_upstream ${NGINX_GATEWAY_UPSTREAM};
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Onboarding sessions accept multiple files within the gateway's aggregate limit.
    location ^~ /onboard/v1/ {
        client_max_body_size 11m;
        error_page 413 = @upload_too_large;
        set $gateway_upstream ${NGINX_GATEWAY_UPSTREAM};
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Transaction session v1: same proxy and body-overhead backstop as /hr/v1.
    location ^~ /tx/v1/ {
        client_max_body_size 11m;
        error_page 413 = @upload_too_large;
        set $gateway_upstream ${NGINX_GATEWAY_UPSTREAM};
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v2/hr/packages {
        client_max_body_size 11m;
        error_page 413 = @upload_too_large;
        set $gateway_upstream ${NGINX_GATEWAY_UPSTREAM};
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Body-overhead backstop only; the 10 MiB file limit is enforced by the gateway.
    location @upload_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"error":{"code":"too_large","message":"Upload body exceeds the 11 MiB proxy limit"}}';
    }

    location = /api/waitlist {
        set $waitlist_upstream http://waitlist:7400;
        proxy_pass $waitlist_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location /api/auth/ {
        set $auth_upstream http://auth:7300;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ~* \.mjs$ {
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
